# Exa grading manifest — the SAME manifest drives local Run Tests AND the
# server-side Grading Lambda (parity). Schema: everything under 'test:';
# 'setup' installs deps so the grader's env matches the local venv.
test:
  setup: ["pip install -r requirements.txt"]
  command: "python -m pytest -q --junitxml=reports/out.xml"
  reports: "reports/*.xml"
